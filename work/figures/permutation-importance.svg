<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Permutation feature importance</title><desc id="d">Top four features by average precision permutation importance.</desc><rect width="760" height="340" fill="#fff"/><text x="28" y="34" font-family="Arial" font-size="19" fill="#182126">Top permutation importance signals</text><g font-family="Arial" font-size="12" fill="#344147"><text x="28" y="94">log impressions (90d)</text><text x="28" y="151">log clicks (90d)</text><text x="28" y="208">average position</text><text x="28" y="265">content age</text></g><g fill="#176b63"><rect x="210" y="72" width="440" height="28" rx="4"/><rect x="210" y="129" width="351" height="28" rx="4"/><rect x="210" y="186" width="223" height="28" rx="4"/><rect x="210" y="243" width="186" height="28" rx="4"/></g><g font-family="Arial" font-size="12" font-weight="700" fill="#182126"><text x="660" y="91">0.0734</text><text x="571" y="148">0.0585</text><text x="443" y="205">0.0372</text><text x="406" y="262">0.0310</text></g><text x="28" y="316" font-family="Arial" font-size="11" fill="#5d6a70">Importance = decrease in average precision after feature permutation; not causal effect.</text></svg>