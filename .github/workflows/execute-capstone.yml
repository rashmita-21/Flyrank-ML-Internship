name: Execute capstone notebook

on:
  push:
    branches: [main]
    paths:
      - "work/notebooks/capstone.ipynb"
      - ".github/workflows/execute-capstone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-and-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbconvert ipykernel

      - name: Execute capstone notebook from repository root
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.cwd="$GITHUB_WORKSPACE" \
            work/notebooks/capstone.ipynb

      - name: Commit saved notebook outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/capstone.ipynb
          if git diff --cached --quiet; then
            echo "Notebook outputs are already current."
          else
            git commit -m "Save executed capstone notebook outputs"
            git push
          fi
